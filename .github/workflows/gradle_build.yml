# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew build -Pmod_version="$(sed -n 's/^mod_version=//p' gradle.properties)+$(git rev-parse --short=12 HEAD)"

    - name: Record build provenance and SHA-256 checksums
      run: |
        git rev-parse HEAD > dist/source-commit.txt
        sha256sum dist/*.jar > dist/checksums-sha256.txt

    - name: Archive test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Test Reports
        path: '**/build/reports/tests/'
        if-no-files-found: ignore

    - name: Archive Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Artifacts
        path: dist/
        
    - name: Archive mapping.txt
      uses: actions/upload-artifact@v7
      with:
        name: Mappings
        path: mapping/
